# 指定 Log4j2 使用异步 Logger 上下文选择器（基于 Disruptor 无锁队列）
Log4jContextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
# log4j2.component.properties 是 Log4j2 最早加载的配置文件，在 Spring Boot 初始化日志之前就被读取；
# Log4jContextSelector 指定了使用 AsyncLoggerContextSelector，它会为所有 Logger 创建基于 Disruptor 的异步实现；